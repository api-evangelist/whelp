aid: whelp
name: Whelp
description: Whelp is an omnichannel customer messaging and support platform that unifies
  Live Chat, WhatsApp, SMS, Email, Telegram, Facebook Messenger, Instagram, and Viber
  into a single shared team inbox. It pairs a built-in CRM and unified customer view
  with a drag-and-drop AI chatbot builder, outbound bulk-messaging campaigns, and
  reporting and analytics for sales, marketing, and support teams. Whelp is backed
  by 500 Global. No public developer API or documentation surface was found during
  enrichment.
